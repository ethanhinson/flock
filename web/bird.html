<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>flock · bird</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#0d1117; --fg:#e6edf3; --dim:#7d8590; --faint:#4d5560;
    --line:#21262d; --hot:#2f81f7; --ok:#3fb950; --bad:#f85149; --warn:#d29922;
    --mono:ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.5 var(--mono);padding:14px;
       padding-bottom:calc(20px + env(safe-area-inset-bottom));
       max-width:620px;margin-inline:auto}
  h1{font-size:14px;margin:0;font-weight:600;letter-spacing:.02em}
  .sub{color:var(--dim);font-size:11.5px;margin-top:3px}
  .sub .ok{color:var(--ok)}.sub .bad{color:var(--bad)}.sub .warn{color:var(--warn)}

  /* ---- the one number that matters ------------------------------------- */
  .hero{border:1px solid var(--line);border-radius:11px;padding:14px;
        margin-top:13px;background:var(--panel);transition:border-color .1s,background .1s}
  .hero.live{border-color:var(--hot);background:#0d2137}
  .hero.idle{opacity:.75}
  .mine{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
  .layers{font-size:26px;font-weight:600;margin:3px 0 1px;font-variant-numeric:tabular-nums}
  .of{font-size:12px;color:var(--dim);font-weight:400}
  .count{margin-top:10px;display:flex;align-items:baseline;gap:7px}
  .count b{font-size:23px;font-variant-numeric:tabular-nums}
  .count span{font-size:11.5px;color:var(--dim)}

  /* ---- download progress ----------------------------------------------- */
  #dl{margin-top:12px;display:none}
  #dl.on{display:block}
  .plabel{display:flex;justify-content:space-between;font-size:11px;
          color:var(--dim);margin-bottom:4px}
  .track{height:5px;background:#1b2027;border-radius:3px;overflow:hidden}
  .fill{height:100%;width:0;background:var(--hot);border-radius:3px;
        transition:width .18s linear}
  .fill.done{background:var(--ok)}

  /* ---- facts grid ------------------------------------------------------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));
        gap:7px;margin-top:13px}
  .cell{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel)}
  .cell .k{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.07em}
  .cell .v{font-size:13px;margin-top:2px;word-break:break-word;
           font-variant-numeric:tabular-nums}
  .cell .v.ok{color:var(--ok)}.cell .v.bad{color:var(--bad)}.cell .v.warn{color:var(--warn)}

  button{width:100%;background:var(--hot);border:0;color:#fff;border-radius:9px;
         padding:15px;font:inherit;font-weight:600;margin-top:13px}
  button:disabled{background:#1b2027;color:var(--faint)}
  button.leave{background:transparent;border:1px solid var(--line);color:var(--fg)}

  /* ---- plain-language problems ----------------------------------------- */
  #problem{display:none;margin-top:13px;border:1px solid var(--bad);
           border-radius:9px;padding:11px;background:#2d1214}
  #problem.on{display:block}
  #problem .t{font-weight:600;font-size:12.5px;color:var(--bad)}
  #problem .d{font-size:12px;color:var(--fg);margin-top:5px;white-space:pre-wrap}
  #problem .f{font-size:11.5px;color:var(--dim);margin-top:7px}

  /* ---- activity log ---------------------------------------------------- */
  details.log{margin-top:13px}
  details.log summary{font-size:11px;color:var(--dim);cursor:pointer;
                      list-style:none;padding:3px 0}
  details.log summary::-webkit-details-marker{display:none}
  #status{color:var(--dim);font-size:11px;margin-top:5px;
          max-height:34vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
  #status div{padding:1px 0;border-bottom:1px solid #16191e;word-break:break-word}
  #status .ok{color:var(--ok)}#status .bad{color:var(--bad)}
  .foot{margin-top:14px;font-size:11px;color:var(--faint)}
  .foot a{color:var(--dim)}
</style>

<h1>flock · bird</h1>
<div class="sub" id="sub">checking this device…</div>

<div class="hero idle" id="card">
  <div class="mine">my layers</div>
  <div class="layers"><span id="layers">—</span> <span class="of" id="of"></span></div>
  <div class="count"><b id="count">0</b><span>frames computed</span></div>

  <div id="dl">
    <div class="plabel"><span id="dlwhat">weights</span><span id="dlpct">0%</span></div>
    <div class="track"><div class="fill" id="dlfill"></div></div>
  </div>
</div>

<div class="grid">
  <div class="cell"><div class="k">backend</div><div class="v" id="backend">—</div></div>
  <!-- The number that decides whether a layer fits here at all. Worth showing:
       the 128MiB WebGPU default is what produces binding-size errors, and real
       devices grant far more when asked. -->
  <div class="cell"><div class="k">largest tensor</div><div class="v" id="binding">—</div></div>
  <div class="cell"><div class="k">link</div><div class="v" id="link">—</div></div>
  <div class="cell"><div class="k">my kv cache</div><div class="v" id="cache">—</div></div>
  <div class="cell"><div class="k">last compute</div><div class="v" id="ms">—</div></div>
  <div class="cell"><div class="k">frame in</div><div class="v" id="kb">—</div></div>
  <div class="cell"><div class="k">forwards to</div><div class="v" id="next">coordinator</div></div>
</div>

<div id="problem">
  <div class="t" id="ptitle"></div>
  <div class="d" id="pdetail"></div>
  <div class="f" id="pfix"></div>
</div>

<button id="join" disabled>join the flock</button>

<details class="log">
  <summary>activity log ▸</summary>
  <div id="status"></div>
</details>
<div class="foot"><a href="/">← chat with the flock</a></div>

<script type="module">
import {pack, unpack} from '/js/wire.mjs';
import {loadBirdWeights} from '/js/gguf-stream.mjs';
import {Layer, QWEN3_06B} from '/kernels/layer.ts.js';
// The SAME probe /check runs, not a second copy. What this device reports at /join
// is what the allocator plans against, and what a human can read at /check.
import {probe} from '/js/probe.mjs';

const $ = id => document.getElementById(id);
const log = (m, cls = '') => {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = m;
  $('status').prepend(d);              // newest first: the useful end on a phone
};
const set = (id, v, cls) => {
  const n = $(id);
  n.textContent = v;
  n.className = 'v' + (cls ? ' ' + cls : '');
};

// `layers` are this bird's Layer objects, in order, each holding its own slice of
// the K/V cache on the GPU. There is no session and no `past`: the cache lives in
// device memory inside the layers, which is why nothing here marshals tensors.
let device = null, layers = null, meta = null, running = false, count = 0;
let cachedTokens = 0;
let ws = null, chan = null, inChan = null, chain = null;
let rtc = null;      // link FROM the coordinator (or previous bird)
let outRtc = null;   // link TO the next bird, if we have a successor

/** A failure a person can act on, not a stack trace.
 *
 *  Also hands the slot back: every failure here means this device will never
 *  compute, and holding layers it cannot run stalls the whole flock until the
 *  coordinator restarts.
 */
function problem(title, detail, fix) {
  $('ptitle').textContent = title;
  $('pdetail').textContent = detail;
  $('pfix').textContent = fix || '';
  $('problem').classList.add('on');
  if (peerId) {
    fetch('/leave', {method: 'POST', headers: {'Content-Type': 'application/json'},
                     body: JSON.stringify({peer_id: peerId, why: title})})
      .catch(() => {});          // best effort: we are already failing
  }
}
const clearProblem = () => $('problem').classList.remove('on');

// NOTE: there is no shard cache here any more. Caching is web/js/gguf-stream.mjs's
// job now -- it stores the RAW GGUF byte ranges in IndexedDB, which is the same
// artifact the reference path reads, so one cached thing serves both. (Still
// IndexedDB and not the Cache API, for the same reason as before: `caches` only
// exists in a secure context and a phone reaches the coordinator over plain
// http:// on a LAN, so it is undefined there.)

// Send diagnostics to the coordinator: a phone or tablet has no console we can
// read, so failures have to travel back over HTTP to be debuggable at all.
async function report(stage, detail) {
  try {
    await fetch('/diag', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({stage, detail, ua: navigator.userAgent,
                            slot: meta ? meta.slot : null,
                            mem: navigator.deviceMemory || null})});
  } catch {}
}

// WebGPU is now REQUIRED, not preferred. The layers are WGSL compute kernels, so
// there is no CPU fallback to degrade to -- the previous wasm path was ONNX
// Runtime's, and ONNX is gone from the inference path entirely. Saying so plainly
// here beats failing later with a shader error.
const hasGPU = !!navigator.gpu;
const capability = {gpu: hasGPU, backend: hasGPU ? 'webgpu' : 'none'};
$('sub').innerHTML = hasGPU
  ? '<span class="ok">WebGPU available</span> — this device runs real transformer layers'
  : '<span class="bad">no WebGPU</span> — this device cannot be a bird';
set('backend', capability.backend, hasGPU ? 'ok' : 'bad');

// --- download progress ---------------------------------------------------
function progress(what, at, total) {
  $('dl').classList.add('on');
  $('dlwhat').textContent = what;
  if (!total) {
    $('dlpct').textContent = `${(at / 1e6).toFixed(0)}MB`;
    return;
  }
  const pct = Math.min(100, Math.round(at / total * 100));
  $('dlpct').textContent = `${pct}%  ${(at / 1e6).toFixed(0)}/${(total / 1e6).toFixed(0)}MB`;
  $('dlfill').style.width = pct + '%';
}
function progressDone(msg) {
  $('dlfill').classList.add('done');
  $('dlfill').style.width = '100%';
  $('dlpct').textContent = msg;
}

// Claim a slot FIRST — the coordinator decides which layers we own, so two
// phones joining the same flock get different slices automatically.
// No stored identity. The coordinator assigns a peer id on every /join, because
// identity is a property of a live membership, not of a browser profile: a stale
// id let one device take over another's slot, and localStorage cannot tell two
// devices apart when both report navigator.platform as "MacIntel".
let peerId = null;
// True while the FIRST weight stream is in flight. A reassignment during it has to
// wait, or two loads fight over the same GPU buffers.
let loading = false, pendingChain = null;
(async () => {
  // WHAT CAN THIS DEVICE ACTUALLY DO -- measured, and measured BEFORE joining.
  //
  // The coordinator will not give this device a layer whose largest tensor exceeds
  // its maxStorageBufferBindingSize, so these numbers decide the share. Getting them
  // first is the difference between "this device cannot hold layer 39, here is the
  // tensor and the number" and a phone downloading gigabytes and then failing to
  // allocate a buffer. Same module /check runs -- see /js/probe.mjs.
  let caps = null;
  if (hasGPU) {
    try {
      const p = await probe();
      caps = p.caps;
      capability.maxBufferSize = caps.maxBufferSize;
      capability.vendor = caps.vendor;
      log(`gpu limits: buffer ${(caps.maxBufferSize/1e6).toFixed(0)}MB, ` +
          `binding ${(caps.maxStorageBufferBindingSize/1e6).toFixed(0)}MB` +
          (p.detail.computeOk ? ', a real compute pass ran' : ''), 'ok');
      await report('limits', caps);
    } catch (e) { log('could not probe this device: ' + e.message, 'bad'); }
  }

  // Ask for a place, and keep asking if the answer is "wait". `wait` means the
  // coordinator admitted us but a token was in flight, so our layers get assigned at
  // the next token boundary -- a reassignment mid-token would move K/V cache the
  // running token is still writing into. That is milliseconds, not a failure.
  let j = null;
  for (let attempt = 0; attempt < 40; attempt++) {
    j = await (await fetch('/join', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({peer_id: peerId, label: navigator.platform || 'phone',
                            caps}),
    })).json();
    if (!j.wait) break;
    if (attempt === 0) log(j.reason || 'waiting for a layer assignment');
    peerId = j.peer_id || peerId;
    await new Promise(r => setTimeout(r, j.retry_ms || 1200));
  }
  if (j.error) {
    // There is no "flock full" any more -- any number of devices is allowed in.
    // What CAN fail is that the devices present cannot hold the model, and the
    // coordinator says which tensor on which device and by how much.
    problem('this flock cannot hold the model', j.error,
            'Add a device with a bigger maxStorageBufferBindingSize, use a more ' +
            'quantized model, or open /check on each device to see its limits.');
    return;
  }
  if (j.wait) {
    problem('the coordinator never assigned any layers', j.reason || 'still waiting',
            'Reload to try again. If a turn is generating, it will finish first.');
    return;
  }
  meta = j; peerId = j.peer_id;
  if (j.why) log(`share: ${j.why}`);
  // (Deliberately not persisted -- see the note where peerId is declared.)
  $('layers').textContent = `${meta.start}–${meta.end}`;
  $('of').textContent = `of ${meta.n_total} · ${meta.n_layers} layer` +
                        (meta.n_layers === 1 ? '' : 's');
  log(`joined as bird ${meta.slot} — I own layers ${meta.start}–${meta.end}`, 'ok');

  // --- weights: streamed from the model host straight into GPU buffers -----
  //
  // A bird fetches its OWN layers by byte range out of a GGUF file that already
  // sits on HuggingFace. There is no exported shard, no host build step, and the
  // coordinator never moves 67MB per bird -- the split is just a choice about
  // which byte ranges this device asks for, decided when it joined.
  //
  // It STREAMS: each ~4MB chunk goes into its GPU buffer as it arrives, so peak
  // JS heap is one staging chunk rather than one shard. That is the whole reason
  // this path exists -- the old ONNX route held a 126MB shard in the heap while
  // the runtime made its own copy, ~250MB peak, and that is what killed an iPad.
  // See web/js/gguf-stream.mjs.
  if (!hasGPU) {
    // Careful with this wording: the GPU is fine, the API is not exposed. Saying
    // "no GPU" sends people looking at hardware that is not the problem.
    problem('this browser is not exposing WebGPU',
      'The GPU itself is fine — the browser just is not offering the WebGPU API ' +
      'to this page. A bird runs transformer layers as compute shaders, so there ' +
      'is nothing to fall back to.',
      (window.isSecureContext === false && /Chrome/.test(navigator.userAgent))
        ? 'Chrome only exposes WebGPU in a secure context, and this page is plain ' +
          'http on a LAN. Use Safari, or serve the coordinator over https. ' +
          'Open /check for a full report.'
        : 'On iPad/iPhone before iPadOS 26: Settings > Apps > Safari > Advanced > ' +
          'Feature Flags > WebGPU, then reload. Open /check for a full report.');
    await report('no-webgpu', navigator.userAgent);
    return;
  }
  if (!meta.gguf) {
    problem('the coordinator did not say where the weights are',
      'It sent no GGUF url, so there is nothing to download.',
      'Restart the coordinator; it serves one by default.');
    return;
  }

  log(`streaming layers ${meta.start}\u2013${meta.end} from GGUF\u2026`, 'ok');
  const ad = await navigator.gpu.requestAdapter();
  if (!ad) throw new Error('no GPU adapter available');
  // Ask for what a bird needs, not for the adapter's maximum. Its biggest single
  // buffer is an ffn_down at ~3MB, so the 128MiB default is already ample --
  // and WebKit rejects an over-ambitious requiredLimits far more readily than
  // wgpu does, which turned "raise the ceiling for free" into a failed join.
  // Ask for what the adapter SAYS it can do, then step down. Capping this at a
  // guessed 64MB was a mistake: real devices here report 1.07GB (iPhone) and
  // 4.29GB (this Mac), so a fixed cap threw away an order of magnitude of
  // capacity and forced tensor splitting that was never necessary. The default
  // is 128MiB, which is the number that produces binding-size errors -- it is a
  // default, not a hardware limit.
  const adBind = ad.limits.maxStorageBufferBindingSize;
  const adBuf = ad.limits.maxBufferSize;
  for (const frac of [1, 0.5, 0.25, 0]) {
    try {
      device = frac === 0
        ? await ad.requestDevice()                       // last resort: defaults
        : await ad.requestDevice({requiredLimits: {
            maxStorageBufferBindingSize: Math.floor(adBind * frac),
            maxBufferSize: Math.floor(adBuf * frac),
          }});
      break;
    } catch (e) {
      if (frac === 0) throw e;
      log(`limits at ${frac * 100}% refused, stepping down: ${e.message}`);
    }
  }
  set('binding', `${(device.limits.maxStorageBufferBindingSize / 1e6).toFixed(0)} MB`);
  log(`largest tensor this device can hold: ` +
      `${(device.limits.maxStorageBufferBindingSize / 1e6).toFixed(0)} MB`, 'ok');
  // Connect BEFORE streaming. Downloading 400MB takes seconds, and any device that
  // joins during that window reallocates us -- with no socket open, that notice is
  // dropped and we stream (and then display) the range we were told at /join.
  // Measured: one device downloaded all 24 layers, 401MB, while the coordinator had
  // already moved it to 4-15, and its UI kept showing 4-27. Opening the socket first
  // turns that lost notice into a reassignment we can act on mid-download.
  connect();
  loading = true;
  const t = performance.now();
  const got = await loadBirdWeights(device, meta.gguf, meta.start, meta.end, {
    onNote: m => log('gguf: ' + m),
    // One DOM write per whole percent, not per staging chunk: this fires
    // thousands of times for 67MB and a write per call competes with the very
    // allocations the streaming is being careful about.
    onProgress: (() => {
      let lastPct = -1;
      return p => {
        const pct = Math.floor(p.bytesDone / p.bytesTotal * 100);
        if (pct === lastPct) return;
        lastPct = pct;
        progress(`gguf ${p.tensor.replace(/^blk\./, 'blk ')}`,
                 p.bytesDone, p.bytesTotal);
      };
    })(),
  });
  const secs = (performance.now() - t) / 1000;
  const s = got.stats;
  log(`gguf: ${(s.bytesTotal / 1e6).toFixed(0)}MB in ${secs.toFixed(1)}s, ` +
      `${s.tensors} tensors, ${s.requests} range request` +
      `${s.requests === 1 ? '' : 's'}${s.fromCache ? ' (from cache)' : ''}`, 'ok');

  // --- build the layers -----------------------------------------------------
  //
  // fromBuffers rather than create: the weights are already on the GPU and
  // create() would want packed CPU bytes, which is the copy the streaming just
  // avoided. Same kernels either way -- kernels/test_frombuffers.ts asserts the
  // two constructors are bit-identical.
  progress('building layers', 1, 1);
  // Built locally and published in one statement, same as reassign(). The socket is
  // now open BEFORE this runs (so a mid-download reassignment is not lost), so a
  // chain message really can arrive during the build -- it is parked in
  // pendingChain and applied below rather than racing these buffers.
  const built = [];
  for (let i = meta.start; i <= meta.end; i++) {
    const w = got.layers[i];
    if (!w) throw new Error(`the loader returned no tensors for layer ${i}`);
    built.push(await Layer.fromBuffers(device, w, QWEN3_06B));
  }
  layers = built;
  progressDone('ready');
  set('backend', capability.backend, 'ok');
  // The initial stream is done; anything that arrived while it was in flight can
  // now be applied safely.
  loading = false;
  if (pendingChain) {
    const p = pendingChain; pendingChain = null;
    log('applying the reassignment that arrived during the download', 'ok');
    await reassign(p);
  }
  await report('gguf-loaded', {
    mb: +(s.bytesTotal / 1e6).toFixed(1), secs: +secs.toFixed(1),
    tensors: s.tensors, requests: s.requests, cached: s.fromCache,
    layers: layers.length,
  });
  $('join').disabled = false;
  // A refresh shouldn't drop us out of the flock: if we were a member, rejoin.
  // A reload means a new membership, so there is nothing to restore. Auto-joining
  // from a stored flag would claim layers the moment a page is opened -- including
  // a tab someone left behind -- which is how slots ended up held by devices that
  // were not really participating.
  if (new URLSearchParams(location.search).get('join') === '1') {
    running = true;
    $('join').textContent = 'leave the flock';
    $('join').classList.add('leave');
    await keepAwake(true);
    if (!ws || ws.readyState > 1) connect();   // already connected above
    log('rejoined automatically after refresh', 'ok');
  } else {
    log('model ready — tap join', 'ok');
  }
})().catch(e => {
  const m = String(e.message || e);
  log('load failed: ' + m, 'bad');
  report('load-failed', m);
  if (/memory|allocation|OOM/i.test(m)) {
    // The underlying message is included, not swallowed. A phone has no console,
    // so this banner is the ONLY place the real error can be read -- and "ran out
    // of memory" alone does not distinguish a 67MB stream that failed from a
    // buffer the driver refused, which are different fixes.
    problem('this device ran out of memory',
      'The weights needed more memory than this device would give the browser.\n' +
      m,
      'Try: close other tabs and apps, then reload. Or open /flock on another ' +
      'device and tap join — the coordinator re-splits the layers across however ' +
      'many devices are present, so each one holds fewer.');
  } else if (/fetch failed|short read|NetworkError|Load failed/i.test(m)) {
    problem('the download did not finish', m,
      'Check that this device is still on the same wifi as the coordinator, ' +
      'then reload.');
  } else {
    problem('could not load my layers', m,
      'The coordinator was told about this. Reload to try again.');
  }
});

// --- the actual work ------------------------------------------------------
// One source of truth for the link label: whichever channel is really open.
// (A stale "last bird" string used to overwrite the webrtc label here, which
// made the UI claim websocket while every frame went over the data channel.)
function showLink() {
  const up = inChan && inChan.readyState === 'open';
  set('link', up ? 'webrtc' : (ws && ws.readyState === 1 ? 'websocket' : 'connecting…'),
      up ? 'ok' : '');
  const nxt = chain && chain.next_peer;
  set('next', nxt
    ? `layers ${chain.next_range} (${chan && chan.readyState === 'open' ? 'direct' : 'via coordinator'})`
    : 'coordinator');
}

// Where does our output go? To the next bird if we have a link to it, else
// back to the coordinator. Only the LAST bird answers the coordinator, so a
// lap costs one round trip no matter how many devices are in the chain.
function forward(out, m) {
  const frame = pack(out, {seq: m.seq, hidden: meta.hidden, offset: m.offset});
  if (chan && chan.readyState === 'open') { chan.send(frame); return 'bird'; }
  if (inChan && inChan.readyState === 'open') { inChan.send(frame); return 'coord'; }
  ws.send(frame);
  return 'coord';
}

async function runFrame(floats, m) {
  // A frame that arrives while we are between assignments has nowhere to go.
  // Throwing names it; computing with a short chain would put the wrong layers at
  // the right positions and answer plausible garbage.
  if (!layers || !layers.length) {
    throw new Error('this device is not holding any layers right now (a ' +
                    'reassignment is in flight)');
  }
  // A reset means the conversation restarted, so OUR slice of the K/V cache is
  // stale. Each Layer owns its own, so each one clears it.
  if (m.reset) {
    for (const L of layers) L.reset();
    cachedTokens = 0;
    set('cache', '0 tokens');
  }
  const seq = m.seq;

  const t0 = performance.now();
  // Chain the layers on the GPU: layer i reads what layer i-1 wrote through a
  // device-to-device copy, all of it shares ONE command buffer, and only this
  // shard's final output comes back to the host. A readback per layer instead
  // would cost ~24ms each -- bench_layer.ts measured 20.8x for exactly this.
  //
  // The K/V cache never leaves the GPU and is never marshalled: it lives inside
  // the layers, which is why there is no `past` to feed back. Position comes from
  // each layer's own nKeys, so the cache and the positions cannot disagree.
  const enc = device.createCommandEncoder();
  for (let i = 0; i < layers.length; i++) {
    const L = layers[i];
    if (i === 0) {
      // Only the first layer takes the hidden state off the wire.
      if (seq === 1) L.encode(floats, enc);
      else L.encodePrefill(seq, floats, enc);
    } else {
      enc.copyBufferToBuffer(layers[i - 1].outputBuffer(), 0,
                             L.inputBuffer(), 0, seq * meta.hidden * 4);
      // No hidden argument: consume what the copy just put in our own buffer.
      if (seq === 1) L.encode(undefined, enc);
      else L.encodePrefill(seq, undefined, enc);
    }
  }
  device.queue.submit([enc.finish()]);
  const out = await layers[layers.length - 1].readOutput(seq);
  const ms = +(performance.now() - t0).toFixed(1);

  // Bytes, not just token count: this is the share of conversation state that
  // lives on THIS device and nowhere else. nKeys is the layer's own count, so it
  // reports what the GPU actually holds rather than what we think we sent.
  cachedTokens = layers[0].nKeys;
  const bytes = cachedTokens * layers.length * 2 * meta.kv_heads * meta.head_dim * 4;
  set('cache', `${cachedTokens} tokens · ${(bytes / 1e6).toFixed(1)}MB`);

  count++;
  $('count').textContent = count;
  set('ms', ms + ' ms');
  set('kb', (floats.length * 2 / 1024).toFixed(1) + ' KB f16');
  $('card').classList.remove('idle');
  $('card').classList.add('live');
  setTimeout(() => $('card').classList.remove('live'), 120);
  return {out, ms};
}

/**
 * Our range changed: stream the new layers and swap them in.
 *
 * Happens when a device joins or leaves, or when the measured timings say this
 * device should hold more or fewer layers. The old Layers are dropped BEFORE the new
 * ones are streamed -- holding both sets at once is exactly the peak a phone cannot
 * afford, and it is the whole reason the loader streams in the first place.
 *
 * `L.destroy?.()` is optional on purpose: kernels/layer.ts has no destroy() (that
 * file belongs to another agent), so today this is a no-op and the GPU buffers are
 * reclaimed when the Layer objects are collected. Dropping the references first is
 * what actually matters; the call is here so a real destroy() starts being used the
 * day one exists, rather than needing this to be found again.
 *
 * Layers are NOT reused even where the ranges overlap. They could be, and it would
 * save a re-download, but a Layer owns its K/V cache and a reassignment has already
 * cost the conversation its context (the coordinator drops it, because the cache is
 * sharded by layer and a moved layer leaves its keys behind). Keeping one stale cache
 * would be the one case that silently disagrees with the rest.
 */
async function reassign(m) {
  const from = meta.start != null ? `${meta.start}–${meta.end}` : 'nothing';
  log(`reassigned: ${from} → ${m.start}–${m.end}`, 'ok');
  if (m.start == null) {
    // Still a member, holding nothing. Can happen between a join and the next token
    // boundary, and when the flock has more devices than layers.
    for (const L of layers || []) { try { L.destroy?.(); } catch {} }
    layers = [];
    meta = {...meta, start: null, end: null, slot: -1};
    $('layers').textContent = '—';
    $('of').textContent = 'no layers assigned';
    showLink();
    return;
  }
  const prev = layers || [];
  layers = [];
  for (const L of prev) { try { L.destroy?.(); } catch {} }
  meta = {...meta, start: m.start, end: m.end, slot: m.slot,
          n_layers: m.end - m.start + 1};
  $('layers').textContent = `${meta.start}–${meta.end}`;
  $('of').textContent = `of ${meta.n_total} · ${meta.n_layers} layer` +
                        (meta.n_layers === 1 ? '' : 's');
  try {
    progress(`re-streaming layers ${meta.start}–${meta.end}`, 0, 1);
    const got = await loadBirdWeights(device, meta.gguf, meta.start, meta.end, {
      onNote: s => log('gguf: ' + s),
    });
    // Build into a LOCAL array and publish it in one statement at the end. Pushing
    // into `layers` directly is a real hazard rather than a style point: every await
    // here yields to the event loop, so a frame arriving mid-build would find `layers`
    // holding 1 of N built layers, pass runFrame's non-empty check, and compute over a
    // partial chain -- the wrong layers at the right positions, which is exactly the
    // plausible garbage that guard exists to prevent.
    const next = [];
    for (let i = meta.start; i <= meta.end; i++) {
      const w = got.layers[i];
      if (!w) throw new Error(`the loader returned no tensors for layer ${i}`);
      next.push(await Layer.fromBuffers(device, w, QWEN3_06B));
    }
    layers = next;
    progressDone('ready');
    cachedTokens = 0;
    set('cache', '0 tokens');
    // The headline range must follow a reassignment. Logging it is not enough:
    // leaving the join-time value on screen makes every device look like it holds
    // the same layers, which is indistinguishable from a broken allocator.
    $('layers').textContent = `${meta.start}–${meta.end}`;
    $('of').textContent = `of ${meta.n_total} · ${meta.end - meta.start + 1} layer` +
                          (meta.end === meta.start ? '' : 's');
    log(`holding layers ${meta.start}–${meta.end} now`, 'ok');
    if (m.next_peer && !chan) openRTC(m.next_peer);
    showLink();
  } catch (e) {
    const msg = String(e.message || e);
    layers = [];
    log('reassignment failed: ' + msg, 'bad');
    report('reassign-failed', msg);
    problem('could not take the new layers', msg,
      'The coordinator gave this device a different share and the weights did not ' +
      'load. Reload to rejoin; the coordinator will hand these layers to another ' +
      'device meanwhile.');
  }
}

/** Run one frame and hand the result on; any throw here is fatal to the lap, so
 *  report it rather than letting the coordinator just time out. */
async function handleFrame(buf) {
  try {
    const {data, meta: m} = unpack(buf);
    const {out, ms} = await runFrame(data, m);
    forward(out, m);
    ws.send(JSON.stringify({t: 'stats', ms}));
    clearProblem();
  } catch (e) {
    const msg = String(e.message || e);
    log('frame failed: ' + msg, 'bad');
    report('frame-failed', msg);
    problem('a frame failed to compute', msg,
      'The coordinator will report this conversation as stalled. Reload this ' +
      'page to rejoin with a clean cache.');
  }
}

// --- WebRTC: forward straight to the next bird, skipping the coordinator ---
// Open a link to the NEXT bird. This is a SEPARATE PeerConnection from `rtc`
// (the coordinator's) -- a bird in the middle of the chain holds both.
async function openRTC(toPeer) {
  // No WebRTC (an old browser, or a locked-down one): stay on the websocket.
  // Every frame still gets there, just via the coordinator.
  if (typeof RTCPeerConnection !== 'function') {
    log('no WebRTC here — relaying through the coordinator instead');
    return;
  }
  outRtc = new RTCPeerConnection({iceServers: [{urls: 'stun:stun.l.google.com:19302'}]});
  chan = outRtc.createDataChannel('flock', {ordered: true});
  chan.binaryType = 'arraybuffer';
  chan.onopen = () => {
    showLink();
    log('direct link to next bird open — coordinator is out of that hop', 'ok');
    ws.send(JSON.stringify({t: 'forwards', direct: true}));
  };
  chan.onclose = () => {
    chan = null; showLink();
    ws.send(JSON.stringify({t: 'forwards', direct: false}));
  };
  chan.onmessage = ev => {
    // The tail of the chain answered. Relay it back the way it came.
    const {data, meta: m} = unpack(ev.data);
    const frame = pack(data, {seq: m.seq, hidden: meta.hidden, offset: m.offset});
    if (inChan && inChan.readyState === 'open') inChan.send(frame);
    else ws.send(frame);
  };
  outRtc.onicecandidate = e => {
    if (e.candidate) ws.send(JSON.stringify({t:'signal', to: toPeer,
      data: {kind:'ice', candidate: e.candidate.candidate, mid: e.candidate.sdpMid}}));
  };
  const offer = await outRtc.createOffer();
  await outRtc.setLocalDescription(offer);
  ws.send(JSON.stringify({t:'signal', to: toPeer, data: {kind:'offer', sdp: offer}}));
}

// The coordinator is itself a WebRTC peer and offers US a channel. Once it
// opens, activations never touch the websocket again -- it carries only
// signaling, exactly like PeerJS does for swarmllm.
async function onSignal(from, d) {
  if (typeof RTCPeerConnection !== 'function') return;   // websocket-only device
  if (d.kind === 'offer') {
    rtc = new RTCPeerConnection({iceServers: [{urls: 'stun:stun.l.google.com:19302'}]});
    rtc.ondatachannel = e => {
      inChan = e.channel; inChan.binaryType = 'arraybuffer';
      inChan.onopen = () => {
        showLink();
        log('direct link open — websocket is signaling-only now', 'ok');
      };
      inChan.onmessage = ev => handleFrame(ev.data);
    };
    rtc.onicecandidate = e => {
      if (e.candidate) ws.send(JSON.stringify({t:'signal',
        data: {kind:'ice', candidate: e.candidate.candidate, mid: e.candidate.sdpMid}}));
    };
    await rtc.setRemoteDescription({type: 'offer', sdp: d.sdp.sdp});
    const ans = await rtc.createAnswer();
    await rtc.setLocalDescription(ans);
    ws.send(JSON.stringify({t:'signal', data: {kind:'answer', sdp: ans}}));
  } else if (d.kind === 'answer') {
    // An answer to OUR offer always belongs to the outgoing link.
    await (outRtc || rtc).setRemoteDescription(d.sdp);
  } else if (d.kind === 'ice') {
    const pc = from ? outRtc : rtc;   // from a bird => our outgoing link
    if (pc) try {
      await pc.addIceCandidate({candidate: d.candidate, sdpMid: d.mid || '0'});
    } catch {}
  }
}

// --- transport: one websocket, event-driven, no polling -------------------
let beat = null;
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    ws.send(JSON.stringify({peer_id: peerId, label: navigator.platform || 'phone'}));
    log('websocket open — waiting for activations', 'ok');
    showLink();
    clearProblem();
    // Liveness heartbeat: the coordinator drops a bird it has not heard from,
    // and between turns there is nothing else to hear.
    ws.send(JSON.stringify({t: 'ping'}));
    clearInterval(beat);
    beat = setInterval(() => running && ws.send(JSON.stringify({t: 'ping'})), 4000);
  };
  ws.onmessage = ev => {
    if (typeof ev.data === 'string') {
      const m = JSON.parse(ev.data);
      if (m.error && /unknown peer/i.test(m.error)) return onServerForgotUs();
      if (m.error) {
        // The coordinator forgot us -- usually it restarted. Claim a slot again.
        log(m.error, 'bad');
        problem('the coordinator does not recognise this device', m.error,
                'Reload this page to claim a layer slot again.');
        return;
      }
      if (m.t === 'signal') return onSignal(m.from, m.data);
      if (m.t === 'chain') {
        chain = m;
        // The coordinator re-splits the layers whenever a device joins or leaves, or
        // when the timings say this device should hold more or fewer. So a chain
        // message can carry a DIFFERENT range than the one we loaded -- reload the
        // weights rather than keep computing the layers we happen to have, which
        // would put the wrong layers at the right positions and produce text that is
        // wrong without looking wrong.
        if (m.start !== meta.start || m.end !== meta.end) {
          // Mid-initial-stream, reassign() would race loadBirdWeights for the same
          // GPU buffers. Park it; the initial load applies it when it lands.
          if (loading) { pendingChain = m; log(`reassigned mid-download → ` +
              `${m.start}–${m.end}, applying when the stream finishes`); return; }
          return reassign(m);
        }
        if (m.next_peer && !chan) openRTC(m.next_peer);
        showLink();
      }
      return;
    }
    handleFrame(ev.data);   // binary frame: our slice of the lap
  };
  ws.onclose = () => {
    clearInterval(beat);
    showLink();
    if (running) {
      log('socket closed — reconnecting…', 'bad');
      setTimeout(connect, 1500);
    }
  };
  // A coordinator restart forgets every peer id, so reconnecting with the old one
  // is refused. Without handling that the page keeps showing whatever range it was
  // last told -- which is how two devices ended up displaying 22-27 and 20-27,
  // ranges that no longer existed on the server at all. Rejoin from scratch.
  const onServerForgotUs = async () => {
    log('the coordinator does not know this device any more — rejoining', 'bad');
    peerId = null;
    meta = {...meta, start: null, end: null};
    $('layers').textContent = '—';
    $('of').textContent = 'rejoining…';
    for (const L of layers || []) { try { L.destroy?.(); } catch {} }
    layers = [];
    try { ws.close(); } catch {}
    location.reload();        // simplest correct restart: re-probe, re-join, re-stream
  };
  ws.onerror = () => log('websocket error', 'bad');
}

// iOS suspends a backgrounded/locked tab: timers stop, sockets stall, and the
// bird silently leaves the flock. A wake lock keeps the screen on while we're
// a member. Same constraint swarmllm has.
let wake = null;
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator) wake = await navigator.wakeLock.request('screen');
    else if (wake) { await wake.release(); wake = null; }
  } catch (e) { log('wake lock unavailable: ' + e.message); }
}
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && running) {
    await keepAwake(true);
    if (!ws || ws.readyState > 1) connect();
    log('tab active again', 'ok');
  }
});

// A closing tab should free its layers rather than wait to age out.
addEventListener('pagehide', () => {
  if (!peerId || !running) return;
  const body = JSON.stringify({peer_id: peerId, why: 'tab closed'});
  // sendBeacon survives unload; fetch usually does not.
  if (navigator.sendBeacon) {
    navigator.sendBeacon('/leave', new Blob([body], {type: 'application/json'}));
  }
});

$('join').onclick = async () => {
  running = !running;
  $('join').textContent = running ? 'leave the flock' : 'join the flock';
  $('join').classList.toggle('leave', running);

  await keepAwake(running);
  if (running) { clearProblem(); connect(); }
  else {
    // Say so, rather than just dropping the socket. A closed socket and a refresh
    // look identical to the coordinator, so it waits out the 40s liveness grace
    // period before handing these layers on -- during which the flock is uncovered.
    // Leaving on purpose gets them reassigned immediately.
    try {
      await fetch('/leave', {method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({peer_id: peerId})});
      log('left the flock — the coordinator is re-splitting the layers', 'ok');
    } catch (e) { log('could not tell the coordinator we left: ' + e.message); }
    if (ws) ws.close();
    $('card').classList.add('idle');
  }
};
</script>
