<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>flock · bird</title>
<style>
  :root{--bg:#0b0d10;--fg:#e6edf3;--dim:#7d8590;--line:#21262d;--hot:#2f81f7;--ok:#3fb950;--bad:#f85149}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;padding:16px}
  h1{font-size:16px;margin:0 0 2px}
  .sub{color:var(--dim);font-size:12px}
  .card{border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:14px}
  .card.live{border-color:var(--hot);background:#0d2137}
  .big{font-size:30px;font-weight:600;margin:6px 0}
  .row{display:flex;justify-content:space-between;color:var(--dim);font-size:12px;padding:3px 0}
  .row b{color:var(--fg);font-weight:600}
  button{width:100%;background:var(--hot);border:0;color:#fff;border-radius:9px;
         padding:15px;font:inherit;font-weight:600;margin-top:14px}
  button:disabled{background:#21262d;color:var(--dim)}
  #status{color:var(--dim);font-size:12px;margin-top:10px;white-space:pre-wrap}
  .ok{color:var(--ok)}.bad{color:var(--bad)}
</style>

<h1>🕊 flock · bird</h1>
<div class="sub" id="sub">checking WebGPU…</div>

<div class="card" id="card">
  <div class="row"><span>my layers</span><b id="layers">—</b></div>
  <div class="big"><span id="count">0</span> <span style="font-size:14px;color:var(--dim)">laps flown</span></div>
  <div class="row"><span>last compute</span><b id="ms">—</b></div>
  <div class="row"><span>frame in</span><b id="kb">—</b></div>
  <div class="row"><span>backend</span><b id="backend">—</b></div>
  <div class="row"><span>my kv cache</span><b id="cache">—</b></div>
  <div class="row"><span>link</span><b id="link">connecting…</b></div>
  <div class="row"><span>frames via webrtc</span><b id="rtccount">0</b></div>
</div>

<button id="join" disabled>join the flock</button>
<div id="status"></div>

<script type="module">
import * as ort from 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.webgpu.min.mjs';
import {pack, unpack} from '/js/wire.mjs';
ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/';

const $ = id => document.getElementById(id);
const log = (m, cls='') => $('status').innerHTML += `<div class="${cls}">${m}</div>`;

let session = null, meta = null, running = false, count = 0, past = null;
let ws = null, chan = null, inChan = null, chain = null, rtcFrames = 0;
let rtc = null;      // link FROM the coordinator (or previous bird)
let outRtc = null;   // link TO the next bird, if we have a successor
const empty = () => new ort.Tensor('float32', new Float32Array(0),
                                   [1, meta.kv_heads, 0, meta.head_dim]);

// --- shard cache (IndexedDB; works over plain http, unlike the Cache API) ---
function idbOpen() {
  return new Promise(res => {
    let req;
    try { req = indexedDB.open('flock', 1); } catch { return res(null); }
    req.onupgradeneeded = () => req.result.createObjectStore('shards');
    req.onsuccess = () => res(req.result);
    req.onerror = () => res(null);         // no cache is survivable
  });
}
function idbGet(db, key) {
  return new Promise(res => {
    if (!db) return res(null);
    try {
      const r = db.transaction('shards').objectStore('shards').get(key);
      r.onsuccess = () => res(r.result || null);
      r.onerror = () => res(null);
    } catch { res(null); }
  });
}
function idbPut(db, key, val) {
  return new Promise((res, rej) => {
    if (!db) return res();
    try {
      const tx = db.transaction('shards', 'readwrite');
      tx.objectStore('shards').put(val, key);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error || new Error('idb write failed'));
    } catch (e) { rej(e); }
  });
}

// Send diagnostics to the coordinator: a phone or tablet has no console we can
// read, so failures have to travel back over HTTP to be debuggable at all.
async function report(stage, detail) {
  try {
    await fetch('/diag', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({stage, detail, ua: navigator.userAgent,
                            mem: navigator.deviceMemory || null})});
  } catch {}
}

const hasGPU = !!navigator.gpu;
$('sub').innerHTML = hasGPU
  ? '<span class="ok">WebGPU available — this phone runs real layers</span>'
  : '<span class="bad">no WebGPU — falling back to CPU/wasm (slower)</span>';

// Claim a slot FIRST — the coordinator decides which layers we own, so two
// phones joining the same flock get different slices automatically.
let peerId = localStorage.getItem('flock_peer') || null;
(async () => {
  // What can this device actually do? A buffer limit smaller than the shard is
  // an instant, explainable failure rather than a mysterious OOM.
  if (hasGPU) {
    try {
      const ad = await navigator.gpu.requestAdapter();
      const L = ad.limits;
      const maxBuf = L.maxBufferSize, maxBind = L.maxStorageBufferBindingSize;
      log(`gpu limits: buffer ${(maxBuf/1e6).toFixed(0)}MB, ` +
          `binding ${(maxBind/1e6).toFixed(0)}MB`, 'ok');
      await report('limits', {maxBufferSize: maxBuf,
                              maxStorageBufferBindingSize: maxBind,
                              vendor: ad.info?.vendor, arch: ad.info?.architecture});
    } catch (e) { log('could not query gpu limits: ' + e.message, 'bad'); }
  }
  const j = await (await fetch('/join', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({peer_id: peerId, label: navigator.platform || 'phone'}),
  })).json();
  if (j.error) { log(j.error, 'bad'); return; }
  meta = j; peerId = j.peer_id;
  localStorage.setItem('flock_peer', peerId);
  $('layers').textContent = `${meta.start}–${meta.end} of ${meta.n_total}`;
  log(`joined as bird ${meta.slot} — I own layers ${meta.start}–${meta.end}`, 'ok');

  // Cache the shard so a refresh doesn't re-download 252MB.
  //
  // NOT the Cache API: `caches` only exists in a secure context, and a phone
  // on a LAN reaches us over plain http://, so it is undefined there. IndexedDB
  // has no such restriction and holds blobs of this size fine.
  //
  // Weights live in a SEPARATE .data sidecar — ORT Web won't go looking for it
  // on its own, so we hand it the bytes explicitly below.
  const db = await idbOpen();
  const pendingCache = [];
  // Stream the response into ONE preallocated buffer instead of calling
  // .arrayBuffer(), which materialises a second copy of the whole tensor and is
  // what made an iPad run out of memory on a 126MB shard. Peak extra memory here
  // is one network chunk, not one shard. (swarmllm does the same thing, staging
  // ~4MB at a time straight into GPU buffers.)
  async function grab(url, label) {
    const hit = await idbGet(db, url);
    if (hit) {
      log(`${label} ${(hit.byteLength/1e6).toFixed(0)}MB from cache`, 'ok');
      return hit;
    }
    const t = performance.now();
    const res = await fetch(url);
    if (!res.ok) throw new Error(`${label} fetch failed: ${res.status}`);
    const total = +res.headers.get('content-length') || 0;

    let out;
    if (total && res.body) {
      out = new Uint8Array(total);           // exact size known: one allocation
      let at = 0, lastPct = -1;
      const reader = res.body.getReader();
      for (;;) {
        const {value, done} = await reader.read();
        if (done) break;
        if (at + value.length > total) throw new Error(`${label}: longer than declared`);
        out.set(value, at);
        at += value.length;
        const pct = Math.floor(at / total * 100);
        if (pct >= lastPct + 10) {           // log sparingly; DOM writes cost too
          lastPct = pct;
          log(`${label} ${pct}% (${(at/1e6).toFixed(0)}/${(total/1e6).toFixed(0)}MB)`);
        }
        // Yield so WebKit can hand buffers to the GPU process and reclaim pages
        // before we ask for more -- without this a tight device still dies.
        await new Promise(r => setTimeout(r, 0));
      }
      if (at !== total) throw new Error(`${label}: short read ${at}/${total}`);
    } else {
      out = new Uint8Array(await res.arrayBuffer());   // no content-length
    }

    log(`${label} ${(out.byteLength/1e6).toFixed(0)}MB in ` +
        `${((performance.now()-t)/1000).toFixed(1)}s`, 'ok');
    pendingCache.push([url, out.buffer]);
    return out.buffer;
  }

  // Hand ORT the bytes, then drop OUR reference immediately. Keeping `wbuf`
  // alive alongside ORT's own copy doubles peak usage for no benefit.
  async function build(graph, weights, slot) {
    const view = new Uint8Array(weights);
    try {
      return await ort.InferenceSession.create(graph, {
        executionProviders: hasGPU ? ['webgpu', 'wasm'] : ['wasm'],
        externalData: [{path: `shard${slot}.onnx.data`, data: view}],
      });
    } finally {
      // Release the transferable so the GC can reclaim it while ORT holds its own.
      try { structuredClone(weights, {transfer: [weights]}); } catch {}
    }
  }
  log(`loading my ${meta.n_layers} layers…`);
  const buf  = await grab(`/shard/${meta.slot}.onnx`, 'graph');
  const wbuf = await grab(`/shard/${meta.slot}.onnx.data`, 'weights');

  session = await build(buf, wbuf, meta.slot);
  $('backend').textContent = hasGPU ? 'webgpu' : 'wasm';
  // Session is built; the weights are now ORT's problem, so write the cache and
  // drop our references.
  // Only cache once inference is actually working; a device that is tight on
  // memory should not also be storing 126MB blobs.
  for (const [url, b] of pendingCache) {
    if (b.byteLength === 0) continue;          // already transferred away
    await idbPut(db, url, b).catch(e => log('cache write skipped: ' + e.message));
  }
  pendingCache.length = 0;
  $('join').disabled = false;
  // A refresh shouldn't drop us out of the flock: if we were a member, rejoin.
  if (localStorage.getItem('flock_joined') === '1') {
    running = true;
    $('join').textContent = 'leave the flock';
    await keepAwake(true);
    connect();
    log('rejoined automatically after refresh', 'ok');
  } else {
    log('model ready — tap join', 'ok');
  }
})().catch(e => {
  const m = String(e.message || e);
  log('load failed: ' + m, 'bad');
  report('load-failed', m);
  if (/memory|allocation|OOM/i.test(m)) {
    log('this device ran out of memory building the session. Try: close other ' +
        'tabs, or ask for a smaller slice (more birds = fewer layers each).', 'bad');
  }
});

// --- the actual work ------------------------------------------------------
// One source of truth for the link label: whichever channel is really open.
// (A stale "last bird" string used to overwrite the webrtc label here, which
// made the UI claim websocket while every frame went over the data channel.)
function showLink() {
  const up = inChan && inChan.readyState === 'open';
  const nxt = chain && chain.next_peer;
  $('link').textContent = nxt
    ? `bird ${nxt} (${chan && chan.readyState === 'open' ? 'webrtc' : 'ws'})`
    : `coordinator (${up ? 'webrtc' : 'websocket'})`;
}

// Where does our output go? To the next bird if we have a link to it, else
// back to the coordinator. Only the LAST bird answers the coordinator, so a
// lap costs one round trip no matter how many devices are in the chain.
function forward(out, m) {
  const frame = pack(out, {seq: m.seq, hidden: meta.hidden, offset: m.offset});
  if (chan && chan.readyState === 'open') { chan.send(frame); return 'bird'; }
  if (inChan && inChan.readyState === 'open') { inChan.send(frame); return 'coord'; }
  ws.send(frame);
  return 'coord';
}

async function runFrame(floats, m) {
  if (m.reset) past = null;
  const seq = m.seq;
  const feed = {
    hidden: new ort.Tensor('float32', floats, [1, seq, meta.hidden]),
    position_ids: new ort.Tensor('int64',
      BigInt64Array.from({length: seq}, (_, i) => BigInt(m.offset + i)), [1, seq]),
  };
  // Feed back the K/V we produced last step. THIS is the cache: we own the
  // conversation state for our own layers, and nobody else has it.
  if (meta.kv_cache) {
    for (let i = 0; i < meta.n_layers; i++) {
      feed[`past_k${i}`] = past ? past[`new_k${i}`] : empty();
      feed[`past_v${i}`] = past ? past[`new_v${i}`] : empty();
    }
  }
  const t0 = performance.now();
  const out = await session.run(feed);
  const ms = +(performance.now() - t0).toFixed(1);
  if (meta.kv_cache) {
    past = {};
    for (let i = 0; i < meta.n_layers; i++) {
      past[`new_k${i}`] = out[`new_k${i}`];
      past[`new_v${i}`] = out[`new_v${i}`];
    }
    $('cache').textContent = out.new_k0.dims[2] + ' tokens';
  }
  count++; $('count').textContent = count;
  $('ms').textContent = ms + ' ms';
  $('kb').textContent = (floats.length * 2 / 1024).toFixed(1) + ' KB (f16)';
  $('card').classList.add('live');
  setTimeout(() => $('card').classList.remove('live'), 120);
  return {out: out.output.data, ms};
}

// --- WebRTC: forward straight to the next bird, skipping the coordinator ---
// Open a link to the NEXT bird. This is a SEPARATE PeerConnection from `rtc`
// (the coordinator's) -- a bird in the middle of the chain holds both.
async function openRTC(toPeer) {
  outRtc = new RTCPeerConnection({iceServers: [{urls: 'stun:stun.l.google.com:19302'}]});
  chan = outRtc.createDataChannel('flock', {ordered: true});
  chan.binaryType = 'arraybuffer';
  chan.onopen = () => {
    showLink();
    log('direct link to next bird open — coordinator is out of that hop', 'ok');
    ws.send(JSON.stringify({t: 'forwards', direct: true}));
  };
  chan.onclose = () => {
    chan = null; showLink();
    ws.send(JSON.stringify({t: 'forwards', direct: false}));
  };
  chan.onmessage = ev => {
    // The tail of the chain answered. Relay it back the way it came.
    const {data, meta: m} = unpack(ev.data);
    const frame = pack(data, {seq: m.seq, hidden: meta.hidden, offset: m.offset});
    if (inChan && inChan.readyState === 'open') inChan.send(frame);
    else ws.send(frame);
  };
  outRtc.onicecandidate = e => {
    if (e.candidate) ws.send(JSON.stringify({t:'signal', to: toPeer,
      data: {kind:'ice', candidate: e.candidate.candidate, mid: e.candidate.sdpMid}}));
  };
  const offer = await outRtc.createOffer();
  await outRtc.setLocalDescription(offer);
  ws.send(JSON.stringify({t:'signal', to: toPeer, data: {kind:'offer', sdp: offer}}));
}

// The coordinator is itself a WebRTC peer and offers US a channel. Once it
// opens, activations never touch the websocket again -- it carries only
// signaling, exactly like PeerJS does for swarmllm.
async function onSignal(from, d) {
  if (d.kind === 'offer') {
    rtc = new RTCPeerConnection({iceServers: [{urls: 'stun:stun.l.google.com:19302'}]});
    rtc.ondatachannel = e => {
      inChan = e.channel; inChan.binaryType = 'arraybuffer';
      inChan.onopen = () => {
        showLink();
        log('direct link open — websocket is signaling-only now', 'ok');
      };
      inChan.onmessage = async ev => {
        rtcFrames++; $('rtccount').textContent = rtcFrames;
        const {data, meta: m} = unpack(ev.data);
        const {out, ms} = await runFrame(data, m);
        forward(out, m);
        ws.send(JSON.stringify({t:'stats', ms, transport:'webrtc'}));
      };
    };
    rtc.onicecandidate = e => {
      if (e.candidate) ws.send(JSON.stringify({t:'signal',
        data: {kind:'ice', candidate: e.candidate.candidate, mid: e.candidate.sdpMid}}));
    };
    await rtc.setRemoteDescription({type: 'offer', sdp: d.sdp.sdp});
    const ans = await rtc.createAnswer();
    await rtc.setLocalDescription(ans);
    ws.send(JSON.stringify({t:'signal', data: {kind:'answer', sdp: ans}}));
  } else if (d.kind === 'answer') {
    // An answer to OUR offer always belongs to the outgoing link.
    await (outRtc || rtc).setRemoteDescription(d.sdp);
  } else if (d.kind === 'ice') {
    const pc = from ? outRtc : rtc;   // from a bird => our outgoing link
    if (pc) try {
      await pc.addIceCandidate({candidate: d.candidate, sdpMid: d.mid || '0'});
    } catch {}
  }
}

// --- transport: one websocket, event-driven, no polling -------------------
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    ws.send(JSON.stringify({peer_id: peerId, label: navigator.platform || 'phone'}));
    log('websocket open — waiting for activations', 'ok');
    ws.send(JSON.stringify({t:'pull'}));
    setInterval(() => running && ws.send(JSON.stringify({t:'pull'})), 4000);
  };
  ws.onmessage = async ev => {
    if (typeof ev.data === 'string') {
      const m = JSON.parse(ev.data);
      if (m.t === 'signal') return onSignal(m.from, m.data);
      if (m.t === 'chain') {
        chain = m;
        if (m.next_peer && !chan) openRTC(m.next_peer);
        showLink();
      }
      return;
    }
    // binary frame from the coordinator: our slice of the lap
    const {data, meta: m} = unpack(ev.data);
    const {out, ms} = await runFrame(data, m);
    if (chan && chan.readyState === 'open') {
      chan.send(pack(out, {seq: m.seq, hidden: meta.hidden, offset: m.offset}));
    } else {
      ws.send(pack(out, {seq: m.seq, hidden: meta.hidden, offset: m.offset}));
    }
    ws.send(JSON.stringify({t:'stats', ms,
      transport: (inChan && inChan.readyState === 'open') ? 'webrtc' : 'ws'}));
  };
  ws.onclose = () => { if (running) { log('socket closed — reconnecting…', 'bad'); setTimeout(connect, 1500); } };
}

// iOS suspends a backgrounded/locked tab: timers stop, sockets stall, and the
// bird silently leaves the flock. A wake lock keeps the screen on while we're
// a member. Same constraint swarmllm has.
let wake = null;
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator) wake = await navigator.wakeLock.request('screen');
    else if (wake) { await wake.release(); wake = null; }
  } catch (e) { log('wake lock unavailable: ' + e.message); }
}
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && running) {
    await keepAwake(true);
    if (!ws || ws.readyState > 1) connect();
    log('tab active again', 'ok');
  }
});

$('join').onclick = async () => {
  running = !running;
  $('join').textContent = running ? 'leave the flock' : 'join the flock';
  localStorage.setItem('flock_joined', running ? '1' : '0');
  await keepAwake(running);
  if (running) connect(); else if (ws) ws.close();
};
</script>
