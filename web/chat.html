<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>flock · chat</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#0d1117; --fg:#e6edf3; --dim:#7d8590; --faint:#4d5560;
    --line:#21262d; --hot:#2f81f7; --ok:#3fb950; --bad:#f85149; --warn:#d29922;
    --mono:ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--mono);
       display:flex;flex-direction:column;overflow:hidden}

  /* ---- header + topology ------------------------------------------------ */
  header{padding:10px 14px;border-bottom:1px solid var(--line);flex:none}
  .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  h1{margin:0;font-size:14px;font-weight:600;letter-spacing:.02em}
  #sub{color:var(--dim);font-size:11.5px}
  #sub .bad{color:var(--bad)}#sub .ok{color:var(--ok)}

  /* The chain is horizontally scrollable so 8 birds never break the layout. */
  #pipe{display:flex;gap:6px;align-items:stretch;margin-top:10px;
        overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
  .node{flex:0 0 auto;min-width:118px;border:1px solid var(--line);border-radius:8px;
        padding:7px 9px;background:var(--panel);transition:border-color .1s,background .1s}
  .node.live{border-color:var(--hot);background:#0d2137}
  .node.dead{opacity:.5;border-style:dashed}
  .node .who{font-size:11.5px;font-weight:600;display:flex;gap:5px;align-items:center}
  .node .lay{color:var(--dim);font-size:10.5px;margin-top:2px}
  .node .ms{font-size:15px;margin-top:4px;font-variant-numeric:tabular-nums}
  .node .via{font-size:10px;color:var(--faint);margin-top:1px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:none}
  .dot.up{background:var(--ok)}.dot.down{background:var(--bad)}
  .link{flex:0 0 auto;align-self:center;color:var(--faint);font-size:11px;padding:0 1px}
  .link.p2p{color:var(--hot)}

  /* ---- why each device got its share ----------------------------------- */
  #allocbox{margin-top:7px}
  #allocbox summary{font-size:10.5px;color:var(--dim);cursor:pointer;
                    list-style:none;display:inline-block;padding:2px 0}
  #allocbox summary::-webkit-details-marker{display:none}
  #allocbox summary:before{content:'▸ ';color:var(--faint)}
  #allocbox[open] summary:before{content:'▾ '}
  #alloc{font-size:10.5px;color:var(--dim);margin-top:4px;line-height:1.7;
         font-variant-numeric:tabular-nums}
  #alloc .w{color:var(--warn)}
  #alloc .b{color:var(--bad)}
  #alloc b{color:var(--fg);font-weight:600}

  /* ---- conversation ----------------------------------------------------- */
  #convo{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
  .msg{margin:0 0 14px;max-width:62ch}
  .msg .role{font-size:10.5px;color:var(--dim);text-transform:uppercase;
             letter-spacing:.08em;margin-bottom:3px}
  .msg .body{white-space:pre-wrap;word-wrap:break-word}
  .msg.user{margin-left:auto;text-align:right}
  .msg.user .body{background:#161b22;border:1px solid var(--line);
                  border-radius:9px;padding:8px 11px;display:inline-block;text-align:left}
  .msg.err .body{color:var(--bad)}
  .msg .meta{font-size:10.5px;color:var(--faint);margin-top:5px;
             font-variant-numeric:tabular-nums}
  .cursor{display:inline-block;width:7px;height:1em;background:var(--hot);
          vertical-align:-2px;animation:b 1s steps(2) infinite}
  @keyframes b{50%{opacity:0}}
  .empty{color:var(--faint);font-size:12px;text-align:center;margin-top:12vh;line-height:1.9}
  .empty b{color:var(--dim);font-weight:400}

  /* ---- per-turn stats table -------------------------------------------- */
  details.stats{margin-top:7px;max-width:62ch}
  details.stats summary{font-size:10.5px;color:var(--dim);cursor:pointer;
                        list-style:none;display:inline-block;padding:2px 0}
  details.stats summary::-webkit-details-marker{display:none}
  details.stats summary:hover{color:var(--fg)}
  .tw{overflow-x:auto;margin-top:5px}
  table{border-collapse:collapse;font-size:10.5px;font-variant-numeric:tabular-nums}
  th,td{text-align:right;padding:2px 8px 2px 0;white-space:nowrap}
  th{color:var(--faint);font-weight:400;border-bottom:1px solid var(--line)}
  td:first-child,th:first-child{text-align:left}
  tr.prefill td{color:var(--warn)}

  /* ---- composer --------------------------------------------------------- */
  footer{flex:none;border-top:1px solid var(--line);padding:9px;
         padding-bottom:calc(9px + env(safe-area-inset-bottom));background:var(--bg)}
  form{display:flex;gap:7px;align-items:flex-end}
  textarea{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);
           color:var(--fg);border-radius:8px;padding:10px;font:inherit;resize:none;
           max-height:33vh;line-height:1.45}
  textarea:focus{outline:none;border-color:var(--hot)}
  button{background:var(--hot);border:0;color:#fff;border-radius:8px;
         padding:10px 15px;font:inherit;font-weight:600;flex:none}
  button:disabled{background:#21262d;color:var(--faint)}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);
               font-weight:400;padding:10px 11px}
  .bar{display:flex;gap:10px;align-items:center;margin-bottom:7px;
       font-size:10.5px;color:var(--faint);flex-wrap:wrap}
  .bar .grow{flex:1}
  .bar a{color:var(--dim)}

  /* Phones: the topology strip is the first thing to lose space. */
  @media (max-width:560px){
    .node{min-width:96px;padding:6px 7px}
    .node .ms{font-size:13px}
    #convo{padding:11px}
    .msg{max-width:100%}
  }
</style>

<header>
  <div class="top">
    <h1>flock</h1>
    <span id="sub">connecting…</span>
  </div>
  <div id="pipe"></div>
  <!-- WHY the split is what it is. A speed-weighted allocator whose decisions are
       invisible cannot be told apart from a broken one, so the reason the
       coordinator gave is shown verbatim, next to what an even split of the same
       layers would have cost with the same measured rates. -->
  <details id="allocbox"><summary id="allocsum"></summary>
    <div id="alloc"></div>
  </details>
</header>

<div id="convo"><div class="empty" id="empty">
  one model, split across every device in the chain<br>
  <b>ask it something</b>
</div></div>

<footer>
  <div class="bar">
    <span id="ctx">context 0 tokens</span>
    <span class="grow"></span>
    <span id="diag"></span>
    <a href="/flock">join as a bird →</a>
  </div>
  <form id="f">
    <textarea id="q" rows="1" placeholder="ask the flock…"
              autocomplete="off" autocapitalize="sentences"></textarea>
    <button id="send" type="submit">send</button>
    <button id="clear" type="button" class="ghost" title="clear the conversation and every KV cache">clear</button>
  </form>
</footer>

<script type="module">
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
const fmt = n => n == null ? '—' : (+n).toFixed(n < 10 ? 1 : 0);

let status = null;        // last /status payload
let busy = false;         // a turn is streaming right now

// ---- topology strip -----------------------------------------------------
// Rebuilt only when the SHAPE changes; per-token updates just write numbers, so
// a flash animation is never interrupted by an innerHTML replacement.
let shape = '';
function drawPipe(s) {
  const sig = JSON.stringify(s.birds.map(b =>
    [b.slot, b.start, b.end, b.alive, b.transport, b.label]));
  if (sig === shape) {
    // Same devices: refresh only the volatile fields.
    for (const b of s.birds) {
      const via = $(`via${b.slot}`);
      if (via) via.textContent = b.alive ? (b.transport || 'ws') : 'offline';
    }
    return;
  }
  shape = sig;
  const pipe = $('pipe');
  pipe.textContent = '';

  const coord = el('div', 'node', null);
  coord.id = 'coord';
  const cw = el('div', 'who');
  cw.append(el('span', 'dot up'), el('span', null, 'coordinator'));
  const cms = el('div', 'ms', 'idle');
  cms.id = 'coordms';
  coord.append(cw, el('div', 'lay', `layers ${s.coord_layers}`),
               cms, el('div', 'via', s.runtime || 'node'));
  pipe.append(coord);

  s.birds.forEach((b, i) => {
    // A bird that forwards straight to its successor takes the coordinator out
    // of that hop -- worth showing, it is the difference the WebRTC mesh buys.
    const prev = i === 0 ? null : s.birds[i - 1];
    const p2p = prev && prev.forwards_directly && prev.alive && b.alive;
    const arrow = el('div', 'link' + (p2p ? ' p2p' : ''), p2p ? '⇉' : '→');
    if (p2p) arrow.title = 'direct bird-to-bird link: the coordinator is not in this hop';
    pipe.append(arrow);

    const n = el('div', 'node' + (b.alive ? '' : ' dead'));
    n.id = `n${b.slot}`;
    const w = el('div', 'who');
    w.append(el('span', 'dot ' + (b.alive ? 'up' : 'down')),
             el('span', null, b.label && b.label !== '?' ? b.label : `bird ${b.slot}`));
    const ms = el('div', 'ms', b.alive ? (b.last_ms ? fmt(b.last_ms) + ' ms' : 'ready') : 'waiting');
    ms.id = `ms${b.slot}`;
    const via = el('div', 'via', b.alive ? (b.transport || 'ws') : 'offline');
    via.id = `via${b.slot}`;
    n.append(w, el('div', 'lay', `layers ${b.start}–${b.end}`), ms, via);
    pipe.append(n);
  });
}

// ---- why each device got the share it did -------------------------------
// The whole claim of a speed-weighted, bytes-weighted split is that it beats an
// even one. That claim is only checkable if both numbers are visible, so both are:
// the predicted per-token cost of the current assignment, and what an even
// by-layer-count split would have cost at the SAME measured rates.
function drawAlloc(s) {
  const a = s.allocation;
  const box = $('allocbox');
  if (!a || !box) return;
  const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  if (a.infeasible) {
    $('allocsum').innerHTML = '<span class="bad">the devices present cannot ' +
      'hold the model</span>';
    $('alloc').innerHTML = `<span class="b">${esc(a.infeasible.message)}</span>`;
    box.open = true;
    return;
  }
  const gain = a.makespan_ms && a.even_split_ms
    ? (a.even_split_ms - a.makespan_ms) / a.even_split_ms : 0;
  $('allocsum').innerHTML =
    `${a.devices} device${a.devices === 1 ? '' : 's'} over layers ${a.bird_layers}` +
    (a.makespan_ms != null
      ? ` · ~${a.makespan_ms}ms/token predicted` +
        (gain > 0.005 ? ` · ${(gain * 100).toFixed(0)}% better than an even split` : '')
      : '') + ' — why?';
  const rows = s.birds.map(b => {
    const trust = b.rate_trusted
      ? `${b.rate_mb_per_ms}MB/ms measured over ${b.rate_samples} tokens`
      : `<span class="w">assumed speed (${b.rate_samples}/${a.min_samples} ` +
        `timings so far)</span>`;
    const lim = b.max_binding_mb == null
      ? 'no limit reported'
      : `${b.max_binding_mb}MB per tensor`;
    return `<div><b>${esc(b.label)}</b> — ${esc(b.why)}<br>&nbsp;&nbsp;${trust} · ` +
           `${lim}</div>`;
  });
  rows.push(`<div>predicted per token: <b>${a.makespan_ms ?? '—'}ms</b>; an even ` +
            `split of the same layers at the same rates: ${a.even_split_ms ?? '—'}ms` +
            `</div>`);
  rows.push(`<div>per-layer size: ${(a.layer_mb || []).join(' / ')} MB — the split ` +
            `weights by BYTES, not layer count</div>`);
  const d = a.decision || {};
  rows.push(`<div>last decision: ${d.moved ? '<b>moved layers</b>' : 'left it alone'}` +
            ` — ${esc(d.reason || '')}</div>`);
  if (s.last_rebalance) {
    rows.push(`<div class="w">the flock last changed shape ` +
      `${Math.round((Date.now() - s.last_rebalance.at) / 1000)}s ago, which dropped ` +
      `the conversation context: ${esc(s.last_rebalance.reason)}</div>`);
  }
  $('alloc').innerHTML = rows.join('');
}

function drawHead(s) {
  const devices = s.birds.filter(b => b.alive).length + 1;
  if (s.ready) {
    $('sub').innerHTML = `<span class="ok">${s.n_total} layers · ${devices} devices</span>` +
      ` · ${s.model || 'model'} · kv ${s.kv_cache ? 'on' : 'off'} · wire ${s.wire}`;
  } else {
    $('sub').innerHTML = `<span class="bad">waiting for layers ${s.missing.join(', ')}</span>` +
      ` — open <a href="/flock" style="color:var(--dim)">/flock</a> on each device`;
  }
  $('ctx').textContent = `context ${s.cached_tokens} tokens · ${s.turns} turn${s.turns === 1 ? '' : 's'}`;
  // Surface what a phone reported: it has no console anyone can read.
  const d = (s.diag || []).filter(x => /fail|error|oom|memory/i.test(x.stage + x.detail));
  $('diag').innerHTML = d.length
    ? `<span style="color:var(--bad)">${d.length} device error${d.length > 1 ? 's' : ''}</span>`
    : '';
  $('diag').title = d.map(x => `${x.device}: ${x.stage} — ${x.detail}`).join('\n');
  $('send').disabled = busy || !s.ready;
}

async function poll() {
  try {
    const s = await (await fetch('/status')).json();
    status = s;
    drawPipe(s);
    drawHead(s);
    drawAlloc(s);
  } catch {
    $('sub').innerHTML = '<span class="bad">coordinator unreachable</span>';
    $('send').disabled = true;
  }
}

// ---- conversation -------------------------------------------------------
// Returns the pieces the caller mutates, rather than making it re-find them with
// querySelector after the fact.
function addMsg(role, text) {
  $('empty')?.remove();
  const m = el('div', `msg ${role}`);
  const label = el('div', 'role',
    role === 'user' ? 'you' : role === 'err' ? 'error' : 'flock');
  const body = el('div', 'body', text || '');
  m.append(label, body);
  $('convo').append(m);
  $('convo').scrollTop = $('convo').scrollHeight;
  return {m, label, body};
}

/** Turn a streaming message into an error in place. */
function toError({m, label, body}, text) {
  m.className = 'msg err';
  label.textContent = 'error';
  body.textContent = text;
}

/** Per-token table for one turn, collapsed by default: readable, not a log dump. */
function statsBlock(hops, wall) {
  const d = el('details', 'stats');
  const decode = hops.filter(h => !h.prefill);
  const avg = k => decode.length
    ? decode.reduce((a, h) => a + (k(h) || 0), 0) / decode.length : 0;
  const toks = decode.length;
  const tps = wall > 0 ? (toks / wall) : 0;

  d.append(el('summary', null,
    `${hops.length} steps · ${tps.toFixed(1)} tok/s · coord ${fmt(avg(h => h.coord_ms))}ms` +
    ` · flock ${fmt(avg(h => h.roundtrip_ms))}ms · ${wall.toFixed(1)}s  ▸`));

  const wrap = el('div', 'tw');
  const t = el('table');
  const birds = hops[0]?.birds || [];
  const head = el('tr');
  for (const h of ['step', 'coord', ...birds.map(b => `${b.range}`), 'lap', 'wire'])
    head.append(el('th', null, h));
  t.append(head);
  for (const h of hops) {
    const tr = el('tr', h.prefill ? 'prefill' : null);
    tr.append(el('td', null, h.prefill ? `prefill ${h.seq}` : String(h.step)));
    tr.append(el('td', null, fmt(h.coord_ms)));
    for (const b of h.birds) tr.append(el('td', null, fmt(b.ms)));
    tr.append(el('td', null, fmt(h.roundtrip_ms)));
    tr.append(el('td', null, `${h.kb}K`));
    t.append(tr);
  }
  wrap.append(t);
  d.append(wrap);
  return d;
}

function flash(id, delay) {
  const n = $(id);
  if (!n) return;
  setTimeout(() => {
    n.classList.add('live');
    setTimeout(() => n.classList.remove('live'), 110);
  }, delay);
}

async function send(prompt, {reset = false} = {}) {
  busy = true;
  $('send').disabled = true;
  addMsg('user', prompt);
  const msg = addMsg('assistant', '');
  const {m, body} = msg;
  const cur = el('span', 'cursor');
  body.append(cur);

  const hops = [];
  const t0 = Date.now();
  let text = '';
  try {
    const res = await fetch('/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({prompt, reset}),
    });
    if (!res.ok || !res.body) throw new Error(`coordinator returned ${res.status}`);
    const rd = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const {done, value} = await rd.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const p of parts) {
        if (!p.startsWith('data: ')) continue;
        const ev = JSON.parse(p.slice(6));

        if (ev.type === 'token') {
          text += ev.text;
          cur.remove();
          body.textContent = text;
          body.append(cur);
          $('convo').scrollTop = $('convo').scrollHeight;
        } else if (ev.type === 'hop') {
          hops.push(ev);
          flash('coord', 0);
          const cm = $('coordms');
          if (cm) cm.textContent = fmt(ev.coord_ms) + ' ms';
          ev.birds.forEach((b, i) => {
            flash(`n${b.slot ?? i}`, 70 * (i + 1));
            const n = $(`ms${b.slot ?? i}`);
            if (n) n.textContent = fmt(b.ms) + ' ms';
          });
        } else if (ev.type === 'rebalanced') {
          // The flock changed shape between two tokens of this answer. The layers
          // that moved took their share of the K/V cache with them, so the
          // conversation context is gone -- said out loud, because a context that
          // silently returns to zero looks like the model forgetting.
          shape = '';                 // the topology strip has to be redrawn
        } else if (ev.type === 'error') {
          cur.remove();
          toError(msg, ev.text);
          return;
        } else if (ev.type === 'done') {
          cur.remove();
          if (!text) body.textContent = ev.text || '(nothing generated)';
          const wall = (Date.now() - t0) / 1000;
          const why = {eos: '', length: ' · hit the token cap',
                       aborted: ' · stopped',
                       rebalanced: ' · the flock changed shape, so the context ' +
                                   'was dropped'}[ev.stop] ?? '';
          m.append(el('div', 'meta',
            `${ev.tokens} tokens · ${ev.prompt_tokens} prompt · ` +
            `${wall.toFixed(1)}s · context ${ev.cached}${why}`));
          if (hops.length) m.append(statsBlock(hops, wall));
          $('convo').scrollTop = $('convo').scrollHeight;
        }
      }
    }
  } catch (e) {
    cur.remove();
    toError(msg, String(e.message || e));
  } finally {
    busy = false;
    poll();
    $('q').focus();
  }
}

// ---- composer -----------------------------------------------------------
const q = $('q');
const grow = () => { q.style.height = 'auto'; q.style.height = q.scrollHeight + 'px'; };
q.addEventListener('input', grow);
// Enter sends, shift+Enter is a newline -- but only on a real keyboard: on a
// phone the on-screen return key should insert a newline, not submit.
q.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !matchMedia('(pointer:coarse)').matches) {
    e.preventDefault();
    $('f').requestSubmit();
  }
});

$('f').onsubmit = e => {
  e.preventDefault();
  const prompt = q.value.trim();
  if (!prompt || busy) return;
  q.value = ''; grow();
  send(prompt);
};

$('clear').onclick = async () => {
  if (busy) return;
  try { await fetch('/reset', {method: 'POST'}); } catch {}
  $('convo').textContent = '';
  const e = el('div', 'empty');
  e.id = 'empty';
  e.innerHTML = 'caches cleared — every device dropped its shard of the conversation<br><b>ask it something</b>';
  $('convo').append(e);
  poll();
};

poll();
setInterval(() => { if (!busy) poll(); }, 2500);
</script>
